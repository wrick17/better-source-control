name: Build and publish extension
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run unit and Git integration tests
        run: npm test

  package:
    name: Build VSIX
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tested source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Package VSIX
        run: npx --yes @vscode/vsce@4.0.0 package --out better-source-control.vsix --skip-license
      - name: Read package version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Save installable extension
        uses: actions/upload-artifact@v7
        id: artifact
        with:
          name: better-source-control-vsix
          path: better-source-control.vsix
          if-no-files-found: error
      - name: Summarize build
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          printf '## Extension build\n\nVersion: **%s**\n\nTests passed on Linux, macOS, and Windows.\n\n[Download the VSIX artifact](%s)\n' "$PACKAGE_VERSION" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to Marketplace
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: package
    runs-on: ubuntu-latest
    concurrency:
      group: marketplace-wrick17-git-change-stats
      cancel-in-progress: false
      queue: max
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download tested VSIX
        uses: actions/download-artifact@v8
        with:
          name: better-source-control-vsix
      - name: Install Marketplace CLI
        run: npm install --global @vscode/vsce@4.0.0
      - name: Check Marketplace version
        id: marketplace
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          vsce show wrick17.git-change-stats --json > "$RUNNER_TEMP/marketplace.json"
          node -e 'const versions = require(process.argv[1]).versions; if (!Array.isArray(versions)) throw Error("Marketplace returned no versions"); const published = versions.some(v => v.version === process.env.PACKAGE_VERSION && !v.targetPlatform); require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `published=${published}\n`); console.log(`${process.env.PACKAGE_VERSION} already published: ${published}`)' "$RUNNER_TEMP/marketplace.json"
      - name: Publish VSIX
        if: steps.marketplace.outputs.published == 'false'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo '::error::Set the VSCE_PAT repository secret to publish this new Marketplace version.'
            exit 1
          fi
          vsce publish --packagePath better-source-control.vsix --skip-license --skip-duplicate
      - name: Summarize publication
        if: always()
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
          ALREADY_PUBLISHED: ${{ steps.marketplace.outputs.published }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" != success ]; then
            result='Publication did not complete. Check the failed step above.'
          elif [ "$ALREADY_PUBLISHED" = true ]; then
            result='This version already exists; no upload was needed.'
          else
            result='Marketplace accepted the upload. Public availability may take a few minutes.'
          fi
          printf '## Marketplace publication\n\nVersion: **%s**\n\n%s\n\n[Open Better Source Control](https://marketplace.visualstudio.com/items?itemName=wrick17.git-change-stats)\n' "$PACKAGE_VERSION" "$result" >> "$GITHUB_STEP_SUMMARY"
